# Bind to hotspot interface only
interface=wlan0
bind-interfaces

# DHCP range
dhcp-range=10.0.0.10,10.0.0.100,12h

# Hijack ALL DNS queries → send to Pi's IP (captive portal)
address=/#/10.0.0.5

# Redirect Android/iOS captive portal probes specifically
address=/connectivitycheck.gstatic.com/10.0.0.5
address=/clients3.google.com/10.0.0.5
address=/captive.apple.com/10.0.0.5
address=/www.apple.com/10.0.0.5
address=/msftconnecttest.com/10.0.0.5
address=/detectportal.firefox.com/10.0.0.5

# Your custom friendly URL
address=/wifi.setup/10.0.0.5
address=/wifi-setup.local/10.0.0.5
